name: TDS GA7 Release Gate

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: "TDS identity: 23f1001497@ds.study.iitm.ac.in"
        run: echo "Identity step for grading"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Test safe payload (expect promote)
        run: |
          curl -s -X POST "https://release-gate.example.workers.dev/release-gate" \
            -H "Content-Type: application/json" \
            -d '{
              "target": "preview",
              "event": "push",
              "ref": "refs/heads/feature",
              "workflow": {
                "trigger": "push",
                "permissions": {"contents":"read","packages":"write","id-token":"none"},
                "testsPassed": true, "matrixComplete": true, "failFast": false,
                "actions": [{"owner":"actions","name":"checkout","ref":"v4"}]
              },
              "image": {
                "multiStage": true, "runsAsRoot": false, "secretMode": "buildkit",
                "criticalVulnerabilities": 0, "digestPinned": true
              }
            }' | tee response.json

      - name: Verify decision is promote
        run: |
          grep -q '"decision":"promote"' response.json
